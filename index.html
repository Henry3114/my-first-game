.live-scene { display: block; width: 100%; aspect-ratio: 1000 / 520; min-height: 0; background: #eee7d6; }
#bakery-canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
.live-scene-heading { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
.live-scene-heading > span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 5px; font-size: 9px; color: #6d7b60; background: #fffdf1e8; box-shadow: 0 2px 8px #4d4f3510; }
.live-scene-heading .icon { width: 13px; height: 13px; }
.visitor-roster { padding: 10px 13px; min-height: 60px; display: flex; align-items: center; gap: 7px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; background: #f9f8ef; }
.visitor-chip { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid #e4e5d5; background: #fffdf3; border-radius: 6px; flex-shrink: 0; text-align: left; color: #859073; }
.visitor-chip.active { background: #edf0df; border-color: #b7c3a1; color: #5b754e; }
.visitor-chip > span { font-size: 10px; white-space: nowrap; }
.visitor-chip small { font-size: 8px; display: block; margin-top: 4px; color: #9aa187; }
.visitor-chip b { font-size: 12px; color: #79935c; font-family: Georgia, serif; font-weight: 400; }
.visitor-dot { width: 11px; height: 11px; border-radius: 50%; background: #b98d65; box-shadow: 0 0 0 3px #f2e9db; }
.look-1 { --guest-color: #7a8d94; }
.look-2 { --guest-color: #c69486; }
.look-3 { --guest-color: #a09d7d; }
.look-4 { --guest-color: #789a85; }
.look-0 { --guest-color: #b98d65; }
.visitor-dot { background: var(--guest-color); }
.roster-empty { display: flex; align-items: center; gap: 7px; font-size: 10px; color: #9ba287; line-height: 1.8; padding: 5px 2px; }
.roster-empty .icon { width: 16px; height: 16px; }
.conversation-card { min-height: 340px; }
.conversation-card .panel-heading { border-bottom: 1px solid #ececdd; height: 48px; padding: 0 16px; }
.conversation-card .panel-heading h2 { font-size: 12px; }
.conversation-card .panel-heading h2 > span { display: none; }
.conversation-stage { padding: 5px 7px; border-radius: 4px; background: #eef1e1; font-size: 8px; color: #8b9c74; }
.conversation-body { padding: 16px; }
.speaker { display: flex; align-items: center; gap: 11px; }
.guest-portrait { width: 41px; height: 44px; position: relative; display: grid; place-items: center; background: var(--guest-color); border-radius: 45% 45% 35% 35%; color: #fff9e6; font-family: var(--serif); font-size: 19px; flex-shrink: 0; }
.guest-portrait > .icon { position: absolute; bottom: -4px; right: -5px; padding: 3px; width: 19px; height: 19px; background: #fbf7e9; color: #b68c72; border-radius: 50%; }
.speaker h3 { font-size: 12px; font-weight: 500; }
.speaker h3 > span { font-size: 8px; color: #a2a88e; margin-left: 8px; font-weight: 400; }
.speaker p { font-size: 9px; color: #8d997b; margin-top: 7px; }
.guest-speech { margin: 16px 0 12px; padding: 12px 13px; min-height: 61px; background: #f3f1e4; border: 1px solid #eae5d3; border-radius: 3px 11px 11px 11px; font-family: var(--serif); font-size: 12px; color: #788568; line-height: 1.9; }
.guest-patience { display: flex; justify-content: space-between; font-size: 8px; color: #a2a98d; margin-bottom: 7px; }
.conversation-actions { display: flex; gap: 7px; margin-top: 13px; }
.conversation-actions .button { min-height: 31px; font-size: 9px; padding: 6px 7px; flex: 1; gap: 4px; }
.conversation-actions .icon { width: 12px; height: 12px; }
.conversation-body > .button { min-height: 34px; margin-top: 12px; font-size: 10px; }
.recommendations { margin-top: 12px; }
.recommendations > span { font-size: 8px; color: #989e86; }
.recommendations > div { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.recommendations small { font-size: 9px; color: #b1926c; line-height: 1.8; }
.recommend-button { font-size: 9px; padding: 5px 7px; border: 1px dashed #d9dec9; background: #f5f5e9; border-radius: 4px; color: #81936d; }
.recommend-button:hover:not(:disabled) { background: #e4ecd6; }
.purchase-receipt { background: #edf2e3; border: 1px solid #e0e7d0; color: #7d9268; font-size: 10px; padding: 13px; margin-top: 18px; display: flex; align-items: center; gap: 8px; line-height: 1.9; border-radius: 5px; }
.purchase-receipt .icon { width: 18px; height: 18px; }
.conversation-empty { padding: 30px 22px; text-align: center; }
.conversation-empty > .icon { width: 30px; height: 30px; color: #b5b89b; margin-bottom: 18px; }
.conversation-empty h3 { font-family: var(--serif); font-size: 14px; font-weight: 400; line-height: 1.9; color: #8c987a; }
.conversation-empty p { font-size: 10px; line-height: 2; color: #a0a68c; margin-top: 14px; }
.today-column { gap: 16px; }
.today-column .order-card .order-paper { padding-top: 17px; }
.today-column .order-card .order-product { margin: 9px 0; }
.today-column .order-card .order-product .pastry { width: 58px; height: 47px; }
.today-column .order-card .order-paper h3 { font-size: 14px; margin-top: 11px; }
.today-column .order-card .order-reward { padding: 8px 0; }
@media (min-width: 1550px) {
  .conversation-card { min-height: 370px; }
  .conversation-body { padding: 22px; }
  .guest-speech { font-size: 14px; min-height: 76px; }
  .conversation-actions .button { font-size: 11px; min-height: 37px; }
  .speaker h3 { font-size: 14px; }
  .speaker p { font-size: 11px; }
  .conversation-body > .button { font-size: 12px; min-height: 41px; }
}
@media (max-width: 1200px) {
  .live-scene { min-height: 0; }
  .live-scene-heading { top: 10px; left: 10px; right: 10px; }
  .live-scene-heading > span { font-size: 7px; padding: 5px 7px; }
  .roster-empty { font-size: 9px; }
  .visitor-roster { padding: 8px 10px; }
  .conversation-body { padding: 13px; }
}
@media (max-width: 740px) {
  .live-scene { aspect-ratio: 1000 / 560; }
  #bakery-canvas { object-fit: cover; }
  .visitor-roster { min-height: 55px; }
  .visitor-chip { padding: 6px 8px; }
  .visitor-chip > span { font-size: 9px; }
  .visitor-chip small { font-size: 7px; }
  .roster-empty { font-size: 9px; }
  .today-column { display: flex; flex-direction: column; gap: 14px; }
  .conversation-card { min-height: 0; }
  .conversation-card .panel-heading { height: 44px; }
  .conversation-body { padding: 17px; }
  .speaker h3 { font-size: 13px; }
  .speaker h3 > span { font-size: 9px; }
  .speaker p { font-size: 10px; }
  .guest-speech { font-size: 14px; padding: 13px 15px; min-height: 55px; }
  .guest-patience { font-size: 10px; }
  .conversation-actions .button { font-size: 12px; min-height: 40px; padding: 8px 10px; }
  .conversation-actions .icon { width: 15px; height: 15px; }
  .conversation-body > .button { font-size: 12px; min-height: 41px; }
  .recommendations > span { font-size: 10px; }
  .recommend-button { font-size: 11px; padding: 8px 12px; }
  .purchase-receipt { font-size: 12px; }
  .conversation-empty { padding: 24px; }
  .conversation-empty h3 { font-size: 16px; }
  .conversation-empty p { font-size: 12px; }
  .today-column .order-card .panel-heading { height: 44px; }
  .today-column .order-card .panel-heading h2 { font-size: 12px; }
  .today-column .order-card .order-paper { margin: 6px 16px 0; padding: 17px 15px 13px; }
  .today-column .order-card .order-paper h3 { font-size: 16px; }
  .today-column .order-card .order-paper > p { font-size: 10px; }
  .today-column .order-card .order-product .pastry { width: 75px; height: 60px; }
  .today-column .order-card .order-product strong { font-size: 12px; }
  .today-column .order-card .order-product div > span { font-size: 10px; }
  .today-column .order-card .order-reward > span { font-size: 10px; }
  .today-column .order-card .order-reward b { font-size: 22px; }
  .today-column .order-card .order-progress { font-size: 9px; }
  .today-column .order-card > .button { margin: 12px 16px 0; width: calc(100% - 32px); min-height: 39px; font-size: 12px; }
  .speaker { gap: 13px; }
}

/* The service loop stays together: tickets, production, and a visible counter. */
.work-heading { padding: 23px 0 20px; }
.work-heading h1 { font-size: 25px; }
.work-heading .subtitle { font-size: 11px; letter-spacing: .3px; }
.work-metrics { padding: 16px 4px; margin-bottom: 20px; }
.work-metrics .metric strong { font-size: 24px; }
.work-metrics .metric small { font-size: 8px; }
.work-layout { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(295px, 1fr); gap: 20px; align-items: start; }
.work-main, .work-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.work-layout .panel-heading { height: 48px; padding: 0 17px; }
.work-layout .panel-heading h2 { font-size: 13px; }
.work-layout .panel-heading h2 span { font-size: 7px; letter-spacing: 1px; margin-left: 8px; }
.work-layout .panel-heading .tag { padding: 5px 8px; font-size: 9px; }
.work-layout .scene-card .panel-heading { height: 42px; }
.work-side .live-scene { aspect-ratio: 1000 / 520; }
.work-side .visitor-roster { min-height: 50px; padding: 8px; }
.work-side .visitor-chip { padding: 5px 7px; gap: 6px; }
.work-side .visitor-chip > span { font-size: 9px; }
.work-side .visitor-chip small { font-size: 7px; }
.work-side .shop-clock { padding: 11px 13px; gap: 10px; }
.work-side .shop-clock small { color: #a5aa93; font-size: 8px; white-space: nowrap; }
.tickets-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; padding: 0 14px 15px; }
.empty-ticket { min-height: 201px; border: 1px dashed #dfe3d2; background: #f8f8ef; border-radius: 6px; padding: 36px 13px 24px; text-align: center; }
.empty-ticket > .icon { color: #b5bca1; width: 25px; height: 25px; margin-bottom: 16px; }
.empty-ticket strong { display: block; font-size: 11px; color: #9aa68a; font-weight: 400; }
.empty-ticket p { font-size: 10px; line-height: 1.9; color: #adb29d; margin-top: 10px; }
.ticket-card { border: 1px solid #e0e2cf; border-radius: 5px; background: #fbf9ed; padding: 12px; position: relative; min-width: 0; }
.ticket-card.assembling { border-color: #c6b582; background: #fcf7e6; }
.ticket-card.packed { border-color: #abc39b; background: #f0f5e7; cursor: grab; }
.ticket-card.urgent { border-color: #c8997e; }
.ticket-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 8px; color: #9b9d84; letter-spacing: .6px; margin-bottom: 11px; }
.ticket-top b { background: #ecefdd; color: #8a9b6b; border-radius: 4px; font-weight: 400; padding: 3px 5px; white-space: nowrap; }
.ticket-card.urgent .ticket-top b { color: #b77b5d; background: #f1e6d8; }
.ticket-customer { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
.ticket-customer strong { font-size: 12px; font-weight: 500; }
.ticket-customer > span { font-family: Georgia, serif; color: #9b835c; font-size: 18px; white-space: nowrap; }
.ticket-card h3 { font-size: 12px; font-weight: 400; margin-top: 7px; color: #808d6c; }
.ticket-need { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-height: 33px; font-size: 9px; color: #9c9d81; margin: 5px 0 4px; }
.ticket-need .icon { width: 12px; height: 12px; }
.inline-action { font-size: 9px; padding: 3px 0; color: #8b986d; background: none; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
.ticket-card > .button { font-size: 10px; min-height: 34px; padding: 7px 6px; gap: 4px; }
.ticket-card .button .icon { width: 13px; height: 13px; }
.ticket-stock { display: flex; gap: 5px; align-items: center; padding: 10px 0; margin-bottom: 3px; font-size: 10px; color: #ae9671; }
.ticket-stock .icon { width: 14px; height: 14px; }
.ticket-hint { font-size: 8px; color: #aaa98e; line-height: 1.8; margin-top: 8px; min-height: 27px; }
.ticket-bottom { border-top: 1px dashed #dedec6; display: flex; align-items: center; justify-content: space-between; margin-top: 9px; padding-top: 7px; font-size: 8px; color: #a6a68b; }
.ticket-bottom .inline-action { font-size: 8px; color: #b09a81; }
.assembly-preview { display: flex; align-items: center; gap: 5px; padding: 4px 0 10px; }
.assembly-preview > .pastry { width: 54px; height: 43px; flex-shrink: 0; }
.assembly-preview > span { font-size: 10px; color: #9c8e64; }
.assembly-preview small { display: block; font-size: 8px; color: #aaa58a; margin-top: 6px; }
.pack-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.pack-choices .button { min-height: 51px; flex-wrap: wrap; padding: 7px 3px; gap: 3px; font-size: 10px; }
.pack-choices small { display: block; width: 100%; font-size: 8px; color: #a1a68b; text-align: center; }
.packed-parcel { display: flex; gap: 10px; align-items: center; margin: 6px 0 15px; padding: 13px 8px; background: #e4edd8; border: 1px dashed #c4d2ad; border-radius: 5px; }
.packed-parcel > .icon { width: 27px; height: 27px; color: #96a375; }
.packed-parcel.gift { background: #eee9cf; border-color: #d5c48a; }
.packed-parcel > span { font-size: 11px; color: #859466; }
.packed-parcel small { display: block; font-size: 8px; color: #a2ab8c; margin-top: 6px; line-height: 1.7; }
.task-running { display: flex; gap: 7px; align-items: center; padding: 18px 5px; font-size: 12px; color: #aa945f; }
.decoration-buttons { display: flex; gap: 3px; flex-wrap: wrap; }
.decoration-buttons .recommend-button { font-size: 8px; padding: 5px 4px; }
.pantry-strip { display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 16px; background: #f3f3e9; gap: 10px; border-block: 1px solid #e9e9dc; }
.pantry-strip > div { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.pantry-strip span { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #869371; }
.pantry-strip span .icon { width: 13px; height: 13px; }
.pantry-strip b { font-family: Georgia, serif; font-size: 17px; font-weight: 400; color: #70845d; margin-left: 2px; }
.supply-button { color: #9b9c7e; padding: 4px 5px; border: 1px solid #dedfca; border-radius: 3px; background: #fbfaee; font-size: 8px; white-space: nowrap; }
.supply-button:hover { background: #e8eddb; }
.production-columns { display: grid; grid-template-columns: 1fr 1fr; }
.mixing-station, .baking-station { padding: 17px; min-width: 0; }
.mixing-station { border-right: 1px solid #e8e8d9; }
.station-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
.station-heading b { color: #b1b497; font-family: Georgia, serif; font-size: 11px; font-weight: 400; }
.station-heading h3 { color: #768661; font-size: 12px; font-weight: 500; }
.station-heading span { font-size: 9px; color: #a7ae92; margin-left: auto; }
.prep-menu { display: flex; flex-direction: column; gap: 7px; }
.prepare-button { width: 100%; display: flex; align-items: center; gap: 6px; padding: 4px 7px; border: 1px solid #e7e7d5; background: #faf9ef; border-radius: 5px; text-align: left; }
.prepare-button:hover:not(:disabled) { background: #edf1df; border-color: #d1dcc0; }
.prepare-button .pastry { width: 42px; height: 35px; flex-shrink: 0; }
.prepare-button > span { font-size: 10px; color: #7f8b6a; }
.prepare-button small { display: block; font-size: 8px; color: #a2a78c; margin-top: 5px; }
.prepare-button > .icon { width: 14px; height: 14px; margin-left: auto; color: #9aaa84; }
.prepared-trays { margin-top: 12px; }
.station-empty { font-size: 9px; color: #afb299; line-height: 1.8; padding: 9px 0; }
.tray-card { padding: 10px; border: 1px dashed #d7d9bf; background: #f4f1df; border-radius: 4px; margin-top: 6px; }
.tray-card > span { display: block; font-size: 10px; color: #968d65; }
.tray-card > span .icon { width: 13px; height: 13px; }
.tray-card small { display: block; font-size: 8px; color: #aaa78a; margin-top: 6px; }
.tray-card .button { min-height: 30px; width: 100%; margin-top: 8px; font-size: 9px; padding: 6px; }
.empty-oven { padding: 24px 12px; min-height: 151px; display: flex; align-items: center; gap: 13px; border: 1px dashed #dfe0c9; border-radius: 6px; color: #aeb19a; background: #f8f7ed; margin-bottom: 8px; }
.empty-oven > .icon { width: 29px; height: 29px; }
.empty-oven span { font-size: 11px; }
.empty-oven small { display: block; font-size: 8px; margin-top: 9px; }
.baking-job { padding: 13px; background: #f3eedf; border: 1px solid #e4dbc3; border-radius: 6px; margin-bottom: 8px; }
.baking-job > div:first-child { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
.baking-job strong { font-size: 11px; font-weight: 500; color: #8c805f; }
.baking-job > div:first-child > span { font-size: 8px; color: #a69e80; }
.bake-gauge { height: 10px; border-radius: 3px; margin-top: 25px; position: relative; background: linear-gradient(to right, #dad8bd 0% 55.5%, #b8c994 55.5% 77.8%, #cea77b 77.8% 100%); }
.bake-gauge i { display: block; position: absolute; top: -7px; width: 2px; height: 21px; background: #7c7250; }
.bake-gauge i:before { content: ''; position: absolute; top: -3px; left: -3px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #7c7250; }
.bake-labels { display: flex; justify-content: space-between; color: #a6a084; font-size: 8px; padding-top: 7px; }
.bake-labels > span:nth-child(2) { color: #849d61; margin-left: 26%; }
.baking-job > p { display: flex; justify-content: space-between; align-items: center; color: #9d8d61; font-size: 11px; margin: 15px 0 12px; gap: 6px; }
.baking-job small { font-size: 8px; color: #a69b79; }
.baking-job .button { font-size: 10px; min-height: 34px; padding: 7px; }
.baking-job.golden { background: #f1f3df; border-color: #a7bb82; }
.baking-job.golden > p { color: #729151; }
.baking-job.over, .baking-job.burnt { border-color: #bd9574; background: #f3e8d8; }
.production-footnote { font-size: 8px; line-height: 1.9; color: #a5ac91; padding: 12px 16px; border-top: 1px solid #ebeadc; background: #fcfbf2; }
.production-footnote > .icon { width: 11px; height: 11px; margin-right: 4px; }
.shelf-items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 12px 12px; gap: 9px; }
.shelf-item { display: flex; align-items: center; gap: 7px; padding: 10px 4px; border: 1px solid #eceadc; border-radius: 5px; background: #f9f7ed; min-width: 0; }
.shelf-item .pastry { width: 55px; height: 44px; flex-shrink: 0; }
.shelf-item > div { flex: 1; min-width: 0; }
.shelf-item strong { font-size: 10px; font-weight: 400; color: #7d8a68; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.shelf-item b { font-family: Georgia, serif; font-size: 19px; font-weight: 400; margin-right: 10px; color: #8c9e70; }
.shelf-item span { font-size: 8px; color: #a6ac91; display: block; margin-top: 6px; }
.shelf-promo { padding: 8px 16px; border-top: 1px solid #eeeddf; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.shelf-promo small { font-size: 8px; color: #a5ab92; }
.work-side .conversation-card { min-height: 0; }
.work-side .conversation-empty { padding: 21px; }
.work-side .conversation-empty h3 { font-size: 14px; }
.work-side .conversation-empty p { font-size: 11px; }
.work-side .guest-speech { min-height: 0; font-size: 12px; margin-top: 13px; }
.need-summary { display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-between; font-size: 9px; color: #94a078; line-height: 1.8; padding-bottom: 10px; }
.need-summary .icon { width: 12px; height: 12px; }
.reservation-body { padding: 0 18px 17px; }
.reservation-body > strong { font-family: var(--serif); font-weight: 400; font-size: 15px; }
.reservation-body > p { font-size: 10px; color: #9c9f85; margin-top: 9px; }
.reservation-body > div { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; margin-top: 9px; border-block: 1px dashed #e2dfc9; }
.reservation-body > div > span { font-size: 10px; color: #9b9c7f; }
.reservation-body b { font-size: 23px; font-family: Georgia, serif; font-weight: 400; color: #8a9c70; }
.reservation-body > small { display: block; font-size: 9px; line-height: 1.8; color: #adb095; margin-top: 10px; }
.reservation-body .button { font-size: 11px; min-height: 35px; margin-top: 13px; }
.reservation-status { display: block; font-size: 11px; color: #8d9e76; margin-top: 14px; }
.recipe-ingredients { font-size: 10px; color: #9caa87; line-height: 1.8; margin-top: 12px; }
.review-row { display: flex; align-items: center; gap: 16px; padding: 20px; border-bottom: 1px solid #eeeee1; }
.review-row > strong { display: block; font-family: Georgia, serif; font-size: 29px; font-weight: 400; }
.review-row strong small { font-size: 9px; margin-left: 3px; }

  return `<div class="section-intro"><span class="tag">${icon('book')} 今日菜单 ${state.menu.length} / 3 款</span><p>开门前选择三款；做好的面包和未完成的预订需要保留在当天菜单。每炉六份，原料从原料柜扣除。</p></div><div class="product-grid recipe-grid">${PRODUCTS.map(p => { const unlocked = state.unlocked.includes(p.id), onMenu = state.menu.includes(p.id); return `<article class="product-card ${!unlocked ? 'is-locked' : ''}"><div class="product-art art-${p.id}">${pastry(p.id)}<span class="product-tag">${onMenu ? '今日菜单' : unlocked ? '已掌握' : `口碑 ${p.unlock} 研发`}</span></div><div class="product-body"><div class="product-title"><h3>${p.name}</h3><strong>${money(sellingPrice(state, p.id))}<small>/ 份</small></strong></div><p>${p.description}</p><div class="recipe-ingredients">${INGREDIENTS.map(i => `${i.name} ${p.ingredients[i.id]}`).join(' · ')}</div><div class="product-meta"><span>揉面 4s · 烘焙 ${bakeDuration(state, p.id)}s</span><span>6 份成本 ${money(p.cost)}</span></div>${unlocked ? action(`menu:${p.id}`, `${icon(onMenu ? 'check' : 'plus')} ${onMenu ? '移出今日菜单' : '加入今日菜单'}`, `button ${onMenu ? 'outline' : 'primary'} full`, state.phase !== 'prep' ? 'disabled' : '') : action(`research:${p.id}`, `${icon('book')} 研发 · ${money(p.research)}`, 'button outline full', state.reputation < p.unlock ? 'disabled' : '')}${unlocked ? `<div class="recipe-growth"><span>${['基础配方', '改良配方', '招牌配方'][state.recipeLevels[p.id]]} · 好评出餐 ${state.mastery[p.id]} 份</span>${state.recipeLevels[p.id] < 2 ? action(`improve:${p.id}`, `升级${state.recipeLevels[p.id] ? '招牌' : '改良'} · ${money(state.recipeLevels[p.id] ? 160 : 80)}`, 'button outline full', state.mastery[p.id] < (state.recipeLevels[p.id] ? 18 : 6) ? 'disabled' : '') : '<small>售价 +¥3，烘焙缩短 4 秒</small>'}</div>` : ''}</div></article>`; }).join('')}</div>`;
}
function upgrades() {
  return `<div class="growth-banner"><div><span class="eyebrow">A LITTLE MORE ROOM TO BREATHE</span><h2>把忙碌，变成从容。</h2><p>设备直接改善工作流程。员工只接手对应岗位；当前每日水电与工资 ${money(wages(state))}。</p></div>${icon('wheat')}</div><div class="upgrade-grid">${UPGRADES.map(u => `<article class="upgrade-card panel"><div class="upgrade-icon">${icon(u.icon)}</div><div class="upgrade-heading"><h3>${u.name}</h3><span>Lv. ${state.upgrades[u.id]} / ${u.max}</span></div><p>${u.description}</p>${action(`upgrade:${u.id}`, state.upgrades[u.id] >= u.max ? `${icon('check')} 已完成` : `添置设备 <span>${money(upgradeCost(state, u))} ${icon('arrow')}</span>`, 'button outline full', state.upgrades[u.id] >= u.max ? 'disabled' : '')}</article>`).join('')}</div><section class="decoration panel"><div><span class="eyebrow">A TOUCH OF YOU</span><h2>一间自己喜欢的小店。</h2><p>门面配色免费更换。</p></div><div class="theme-options">${[['sage', '鼠尾草绿'], ['rose', '落日玫瑰'], ['sand', '蜂蜜暖棕']].map(([id, label]) => action(`theme:${id}`, `<i class="theme-swatch ${id}">${state.theme === id ? icon('check') : ''}</i><span>${label}</span>`, `theme-button ${state.theme === id ? 'active' : ''}`)).join('')}</div></section>`;
}
function journal() {
  return `<section class="regulars"><div class="section-heading"><div><h2>街坊与小店</h2><p>把订单做好，关系就会慢慢长出来。</p></div><span class="tag">${state.totalServed} 次用心交付</span></div><div class="regular-grid">${REGULARS.map(r => { const n = state.affection[r.id]; return `<article class="regular-card panel"><div class="avatar" style="--avatar-color:${r.color}">${r.initial}</div><div><h3>${r.name}<small>${n >= 9 ? '老朋友' : n >= 4 ? '渐渐熟悉' : '初次相识'}</small></h3><span class="muted">${r.tag}</span><p>${n ? r.stories[Math.min(2, Math.floor(n / 4))] : '记住偏好，把合适的面包交给他。'}</p><span class="muted">好感 ${n} · 合心意的出餐会增加好感</span></div></article>`; }).join('')}</div></section><div class="journal-columns"><section class="panel journal-feed"><div class="panel-heading"><h2>顾客的评价</h2><span class="muted">最近 20 条</span></div>${state.reviews.map(r => `<article class="review-row"><strong class="${r.score >= 75 ? 'positive' : 'negative'}">${r.score}<small>分</small></strong><div><b>${esc(r.name)} · ${getProduct(r.product).name}</b><p>${esc(r.comment)}</p><small>第 ${r.day} 天</small></div></article>`).join('') || '<div class="empty-state">交付第一份订单，听听客人的反馈。</div>'}<div class="panel-heading"><h2>营业流水</h2></div>${state.events.map(e => `<div class="feed-item"><span class="feed-icon ${esc(e.type)}">${icon(e.type === 'sale' ? 'coin' : e.type === 'miss' ? 'people' : 'wheat')}</span><div><p>${esc(e.text)}</p><small>第 ${e.day} 天 · ${time(e.minute)}</small></div></div>`).join('')}</section><section class="panel history-panel"><div class="panel-heading"><h2>营业小结</h2>${icon('chart')}</div>${state.history.map(h => `<article class="history-row"><div><b>第 ${h.day} 天</b><small>交付 ${h.served} 单 · 丢单 ${h.missed}</small></div><strong class="${h.profit >= 0 ? 'positive' : 'negative'}">${h.profit >= 0 ? '+' : '−'}${money(Math.abs(h.profit))}<small>营业利润</small></strong></article>`).join('') || '<div class="empty-state">打烊后，记下今天的经营收获。</div>'}</section></div>`;
}
function render() {
  const focused = document.activeElement?.dataset.action;
  app.innerHTML = `${sidebar()}<main>${header()}${metrics()}<div class="page-content">${view === 'shop' ? shop() : view === 'recipes' ? recipes() : view === 'upgrades' ? upgrades() : journal()}</div><footer>麦间 · 街角烘焙日记 v2.0 <span>用双手，经营一份热腾腾的日常。</span><span>慢慢来，好味道值得等待 ${icon('wheat')}</span></footer></main>`;
  if (view === 'shop') {
    const placeholder = app.querySelector('#bakery-canvas');
    if (sceneCanvas) placeholder.replaceWith(sceneCanvas);
    else { sceneCanvas = placeholder; createBakeryScene(sceneCanvas, { getState: () => state, isPaused: () => state.paused || !!modal || document.hidden, getSelected: () => selectedGuest()?.id, onSelect: id => { selectedVisitorId = id; render(); }, onDeliver: (orderId, visitorId) => run(() => deliverOrder(state, orderId, visitorId)) }); }
  }
  if (focused) app.querySelector(`[data-action="${focused}"]`)?.focus({ preventScroll: true });
}
function openModal(kind, id = null) {
  modal = kind; modalId = id; let content;
  if (kind === 'summary') {
    const h = state.lastSummary; if (!h) return dismiss();
    const best = h.byProduct ? PRODUCTS.reduce((a, p) => (h.byProduct[p.id] || 0) > (h.byProduct[a.id] || 0) ? p : a, PRODUCTS[0]) : null;
    content = `<div class="summary-art">${icon('wheat')}</div><p class="eyebrow">DAY ${h.day} · A DAY WELL SPENT</p><h2>今天的用心，都有回响。</h2><div class="summary-main"><span>今日营业利润</span><strong class="${h.profit >= 0 ? '' : 'negative'}">${h.profit >= 0 ? '+' : '−'}${money(Math.abs(h.profit))}</strong></div><dl class="summary-ledger"><div><dt>订单实收</dt><dd>${money(h.revenue)}</dd></div><div><dt>消耗原料、包装与水电工资</dt><dd>−${money(h.expense)}</dd></div><div><dt>余量折价回收</dt><dd>+${money(h.clearance)}</dd></div><div><dt>营业心愿奖励</dt><dd>+${money(h.bonus)}</dd></div></dl><div class="summary-people"><span>交付 ${h.served} 单</span><span>平均 ${h.average ?? '—'} 分</span><span>丢单 ${h.missed}</span></div><div class="summary-advice"><p>${best && h.sold ? `今日畅销：${best.name}，明天可以适量多备。` : '明天先准备现货，再接下第一张订单。'}</p><p>${h.late ? `${h.late} 张订单未准时交付，下次控制同时接单数量。` : '接单前看好产能，把承诺留给能完成的订单。'}</p><p>${h.waste ? `${h.waste} 份在制或溢出产品损耗，留意金黄出炉和展示容量。` : '刚出炉的面包，更容易收获好评价。'}</p></div><p class="fine-print">原料在备料时计入成本，采购改变原料和零钱，设备研发投资另计。原料留到明天；未完成批次会损耗，成品折价清售，不会自动完成订单。</p>${action('next', `收好经验，迎接明天 ${icon('arrow')}`, 'button primary full')}${action('dismiss', '先看看今天的小店', 'text-button full')}`;
  } else if (kind === 'close-confirm') content = `${icon('shop', 'modal-symbol')}<h2>今天营业到这里？</h2><p class="modal-subtitle">还有 ${state.orders.length} 张订单、${state.jobs.length + state.trays.length} 盘在制批次。打烊会取消未交付订单、损耗未出炉批次，并清售面包架上的成品。</p>${action('close', '确认打烊', 'button primary full')}${action('dismiss', '继续照顾手里的订单', 'button outline full')}`;
  else if (kind === 'cancel-confirm') { const o = state.orders.find(o => o.id === Number(id)); content = `<h2>取消这张订单？</h2><p class="modal-subtitle">${o ? `${esc(o.name)}的${getProduct(o.product).name}` : '这张订单'}会记为一次未完成。已取出的面包在有陈列空间时回架，已用包装不退费。</p>${action(`cancel:${id}`, '确认取消', 'button danger full')}${action('dismiss', '继续制作', 'button outline full')}`; }
  else if (kind === 'reset-confirm') content = `<h2>重新开一家小店？</h2><p class="modal-subtitle">这会替换当前进度，先导出一份存档，留住这段日子。</p>${action('reset', '确认重新开始', 'button danger full')}${action('settings', '返回存档设置', 'button outline full')}`;
  else content = `<p class="eyebrow">MAKE YOURSELF AT HOME</p><h2>留住小店的每一天。</h2><p class="modal-subtitle">自动保存到当前浏览器，换设备或清理数据前请导出备份。旧版存档可以保留经营进度迁移。</p><div class="settings-group"><h3>存档与备份</h3>${action('export', `${icon('journal')} 导出存档`, 'button outline full')}<label class="button outline full import-button">${icon('book')} 导入存档<input type="file" id="import-save" accept=".json,application/json" /></label></div><div class="settings-group"><h3>经营小贴士</h3><p>开门前选三款菜单。点击备料，4 秒后把面团装进烤箱；指针到金黄区间时手动出炉。</p><p>顾客到柜台后，询问需求并接单。订单夹中取货，再按需求切片、装饰、选择纸袋或礼盒，最后交付。</p><p>一天约 4 分半，最多三张订单；未及时接待或出餐，客人会离开。暂停和打开弹窗都会停止计时。</p><p>设备与员工会解放具体岗位。烘焙帮手负责装炉出炉，包装助手接手普通纸袋，前台店员接常规单和交付。</p></div>${action('reset-confirm', '重新开始游戏', 'text-button danger-text full')}`;
  modalRoot.innerHTML = `<div class="modal-overlay"><section class="modal ${kind === 'summary' ? 'summary-modal' : ''}" role="dialog" aria-modal="true" aria-label="${kind === 'summary' ? '今日营业结算' : '小店设置'}" tabindex="-1">${action('dismiss', icon('close'), 'icon-button modal-close', 'aria-label="关闭弹窗"')}${content}</section></div>`;
  document.body.classList.add('modal-open'); requestAnimationFrame(() => modalRoot.querySelector('.modal')?.focus());
}
function dismiss() { modal = null; modalId = null; modalRoot.innerHTML = ''; document.body.classList.remove('modal-open'); }
document.addEventListener('click', e => {
  const target = e.target.closest('[data-action]'); if (!target || target.disabled) return; e.preventDefault();
  const [name, id, extra] = target.dataset.action.split(':');
  if (['shop', 'recipes', 'upgrades', 'journal'].includes(name)) { view = name; dismiss(); render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
  else if (name === 'jump') document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  else if (name === 'visitor') { selectedVisitorId = Number(id); render(); }
  else if (name === 'prepare') run(() => prepareBatch(state, id));
  else if (name === 'load') run(() => loadOven(state, id));
  else if (name === 'unload') run(() => removeBatch(state, id));
  else if (name === 'buy') run(() => buyIngredient(state, id));
  else if (name === 'menu') run(() => toggleMenu(state, id));
  else if (name === 'open') run(() => openShop(state), '营业开始，先听听第一位客人的需求。');
  else if (name === 'ask') { selectedVisitorId = Number(id); run(() => askVisitor(state, id)); }
  else if (name === 'wait') run(() => waitVisitor(state, id));
  else if (name === 'recommend') run(() => recommendVisitor(state, id, extra));
  else if (name === 'accept') run(() => acceptOrder(state, id));
  else if (name === 'decline') run(() => declineVisitor(state, id));
  else if (name === 'assemble') run(() => startAssembly(state, id));
  else if (name === 'plan') { const o = state.orders.find(o => o.id === Number(id)); if (o) run(() => prepareBatch(state, o.product)); }
  else if (name === 'slice') run(() => sliceOrder(state, id));
  else if (name === 'decorate') run(() => decorateOrder(state, id, extra));
  else if (name === 'pack') run(() => packOrder(state, id, extra));
  else if (name === 'deliver') run(() => deliverOrder(state, id));
  else if (name === 'reservation') run(() => acceptReservation(state), '预订已加入订单夹，记得 14:00–16:00 交付礼盒。');
  else if (name === 'cancel') { dismiss(); run(() => cancelOrder(state, id)); }
  else if (name === 'upgrade') run(() => buyUpgrade(state, id), '工作能力升级完成。');
  else if (name === 'improve') run(() => improveRecipe(state, id), '配方成长完成，新接订单与后续批次按新配方执行。');
  else if (name === 'research') run(() => research(state, id), '新配方已解锁，开门前可加入菜单。');
  else if (name === 'theme') { state.theme = id; save(); render(); }
  else if (name === 'discount') { state.discount = !state.discount; save(); render(); }
  else if (name === 'pause') { state.paused = !state.paused; save(); render(); }
  else if (['settings', 'summary', 'close-confirm', 'reset-confirm', 'cancel-confirm'].includes(name)) openModal(name, id);
  else if (name === 'dismiss') dismiss();
  else if (name === 'close') { dismiss(); run(() => closeShop(state)); openModal('summary'); }
  else if (name === 'next') { dismiss(); run(() => nextDay(state)); }
  else if (name === 'reset') { state = createGame(); selectedVisitorId = null; view = 'shop'; dismiss(); save(); render(); }
  else if (name === 'export') { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = `麦间-第${state.day}天.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); toast('存档已导出。'); }
});
document.addEventListener('dragstart', e => { const card = e.target.closest('.ticket-card.packed'); if (card && e.dataTransfer) { e.dataTransfer.setData('application/x-maijian-order', card.dataset.orderId); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('change', async e => {
  if (e.target.id !== 'import-save') return; const file = e.target.files[0]; if (!file) return;
  try { if (file.size > 1000000) throw Error('存档文件过大。'); const raw = JSON.parse(await file.text()); if (!validateSave(raw)) throw Error('存档格式不正确，原有进度已保留。'); if (!window.confirm(`载入第 ${raw.day} 天的存档，替换当前进度？`)) return; state = hydrateGame(raw); selectedVisitorId = null; view = 'shop'; dismiss(); save(); render(); if (state.phase === 'closed') openModal('summary'); else toast('存档已载入。'); }
  catch (err) { toast(err instanceof SyntaxError ? '无法解析存档，请选择导出的 JSON 文件。' : err.message); } finally { e.target.value = ''; }
});
document.addEventListener('keydown', e => { if (!modal) return; if (e.key === 'Escape') dismiss(); if (e.key === 'Tab') { const items = [...modalRoot.querySelectorAll('button:not(:disabled), input')], first = items[0], last = items.at(-1); if (e.shiftKey && (document.activeElement === first || document.activeElement.classList.contains('modal'))) { e.preventDefault(); last?.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); } } });
modalRoot.addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) dismiss(); });
window.addEventListener('beforeunload', save); document.addEventListener('visibilitychange', save);
setInterval(() => { if (modal || document.hidden || state.paused || state.phase === 'closed') return; const phase = state.phase; advance(state); save(); render(); if (phase === 'open' && state.phase === 'closed') openModal('summary'); }, 1000);
render(); save(); if (loadMessage) toast(loadMessage); if (state.phase === 'closed') openModal('summary');

})();
</script>
