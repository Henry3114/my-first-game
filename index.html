<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>请开启浏览器 JavaScript，开始经营你的烘焙店。</noscript>
  <script>
(() => {
const PRODUCTS = [
  { id: 'roll', name: '奶油餐包', en: 'Butter roll', price: 10, cost: 18, time: 7, description: '柔软蓬松，藏着一小块黄油的香气。', unlock: 0, research: 0, audience: '学生喜爱' },
  { id: 'toast', name: '牛奶吐司', en: 'Milk toast', price: 16, cost: 30, time: 10, description: '烤得金黄的日常，带回家慢慢分享。', unlock: 0, research: 0, audience: '街坊喜爱' },
  { id: 'croissant', name: '黄油可颂', en: 'Croissant', price: 22, cost: 48, time: 13, description: '层层酥香，一口就能听见清脆。', unlock: 0, research: 0, audience: '上班族喜爱' },
  { id: 'cinnamon', name: '肉桂卷', en: 'Cinnamon roll', price: 25, cost: 54, time: 12, description: '温暖的肉桂香，和午后很相配。', unlock: 28, research: 100, audience: '甜点客喜爱' },
  { id: 'cake', name: '草莓小蛋糕', en: 'Strawberry cake', price: 36, cost: 78, time: 16, description: '把一点点庆祝，放进平凡的日子。', unlock: 42, research: 180, audience: '庆祝首选' },
  { id: 'tart', name: '柠檬塔', en: 'Lemon tart', price: 32, cost: 66, time: 14, description: '酸甜恰到好处，像阳光落在舌尖。', unlock: 58, research: 240, audience: '甜点客喜爱' },
];
const WEATHER = [
  { name: '晴朗', label: '阳光正好，街上热闹了些', icon: 'sun', interval: 3, preference: 'roll' },
  { name: '小雨', label: '雨天客人少些，热面包更受欢迎', icon: 'rain', interval: 5, preference: 'toast' },
  { name: '多云', label: '适合散步，也适合一份甜点', icon: 'cloud', interval: 4, preference: 'croissant' },
];
const UPGRADES = [
  { id: 'oven', name: '烤箱扩容', description: '每级多一个烤位，最多同时烤 3 炉。', price: 180, max: 2, icon: 'oven' },
  { id: 'counter', name: '大一点的展示柜', description: '每级增加 18 个陈列位，容得下更多美味。', price: 120, max: 3, icon: 'shop' },
  { id: 'sign', name: '街角新招牌', description: '每级吸引更多客人，提升进店频率。', price: 160, max: 2, icon: 'sparkles' },
  { id: 'helper', name: '请一位烘焙帮手', description: '烘焙耗时减少 35%，每日工资 ¥25。', price: 220, max: 1, icon: 'people' },
];
const REGULARS = [
  { id: 'lin', name: '林奶奶', initial: '林', favorite: 'toast', tag: '总爱买一份牛奶吐司', color: '#d7b6a5', stories: ['“这香味，让我想起以前家门口的店。”', '“老伴说，明天还想吃你家的吐司。”', '“以后周末的早餐，就拜托你啦。”'] },
  { id: 'yu', name: '小雨', initial: '雨', favorite: 'roll', tag: '放学路过的学生', color: '#a7b7aa', stories: ['“放学后最期待的，就是这里的面包！”', '“我把这家店推荐给同学啦。”', '“等妈妈生日，我想来订一个蛋糕。”'] },
];

const getProduct = id => PRODUCTS.find(p => p.id === id);
const capacity = s => 36 + s.upgrades.counter * 18;
const occupied = s => Object.values(s.stock).reduce((a, b) => a + b, 0) + s.jobs.reduce((a, j) => a + j.quantity, 0);
const weatherFor = s => WEATHER[(s.day - 1) % WEATHER.length];
const reputationLabel = s => s.reputation >= 70 ? '社区人气名店' : s.reputation >= 42 ? '街坊口碑小店' : s.reputation >= 28 ? '渐有名气' : '街角新店';
const dailyTarget = s => Math.min(300, 140 + (s.day - 1) * 20);
const upgradeCost = (s, u) => u.price * (s.upgrades[u.id] + 1);
const dailyStats = () => ({ revenue: 0, expense: 0, sold: 0, served: 0, missed: 0, waste: 0, bonus: 0 });

function createGame(seed = Date.now() % 2147483647 || 7) {
  return {
    version: 1, day: 1, cash: 360, reputation: 20, phase: 'prep', minute: 540,
    stock: Object.fromEntries(PRODUCTS.map(p => [p.id, 0])), jobs: [],
    unlocked: ['roll', 'toast', 'croissant'], upgrades: { oven: 0, counter: 0, sign: 0, helper: 0 },
    affection: { lin: 0, yu: 0 }, stats: dailyStats(), totalRevenue: 0, totalServed: 0,
    orderDone: false, discount: false, paused: false, rng: seed, elapsed: 0, nextId: 1,
    events: [], history: [], theme: 'sage', lastSummary: null,
  };
}

function random(s) {
  s.rng = (s.rng * 16807) % 2147483647;
  return s.rng / 2147483647;
}
function event(s, text, type = 'note') {
  s.events.unshift({ id: s.nextId++, text, type, minute: s.minute, day: s.day });
  s.events = s.events.slice(0, 30);
}
function income(s, amount) {
  s.cash += amount; s.stats.revenue += amount; s.totalRevenue += amount;
}
function rep(s, n) { s.reputation = Math.max(0, Math.min(100, s.reputation + n)); }

function bake(s, id) {
  const p = getProduct(id);
  if (!p || !s.unlocked.includes(id)) return { error: '这款配方还没有解锁。' };
  if (s.phase === 'closed') return { error: '今天已打烊，明天再烤吧。' };
  if (s.jobs.length >= 1 + s.upgrades.oven) return { error: '烤箱正忙，等这一炉出炉再来。' };
  if (occupied(s) + 6 > capacity(s)) return { error: '展示柜快满了，卖出一些或升级展示柜吧。' };
  if (s.cash < p.cost) return { error: '零钱不够，可以先出售现有面包，或接一份街坊订单。' };
  s.cash -= p.cost; s.stats.expense += p.cost;
  const duration = Math.ceil(p.time * (s.upgrades.helper ? 0.65 : 1));
  s.jobs.push({ id: s.nextId++, product: id, quantity: 6, remaining: duration, duration });
  event(s, `一炉${p.name}进烤箱啦，期待热乎乎的出炉。`, 'bake');
  return { ok: true };
}

function openShop(s) {
  if (s.phase !== 'prep') return { error: '现在不能开门。' };
  if (!occupied(s)) return { error: '先烤一炉面包，再迎接今天的客人吧。' };
  s.phase = 'open'; s.elapsed = 0;
  event(s, '翻开营业牌，新的一天开始了。', 'open');
  return { ok: true };
}

function customer(s) {
  const regular = random(s) < 0.3 ? REGULARS[Math.floor(random(s) * REGULARS.length)] : null;
  const audiences = [
    { name: '学生', favorites: ['roll', 'toast'] },
    { name: '上班族', favorites: ['croissant', 'toast'] },
    { name: '甜点爱好者', favorites: ['cake', 'tart', 'cinnamon', 'croissant'] },
  ];
  const audience = audiences[Math.floor(random(s) * audiences.length)];
  const favorites = regular ? [regular.favorite] : random(s) < 0.35 ? [weatherFor(s).preference, ...audience.favorites] : audience.favorites;
  const stocked = PRODUCTS.filter(p => s.stock[p.id] > 0);
  let chosen = favorites.map(getProduct).find(p => p && s.stock[p.id] > 0);
  if (!chosen && stocked.length && random(s) < (s.discount ? 0.95 : 0.65)) chosen = stocked[Math.floor(random(s) * stocked.length)];
  if (!chosen) {
    s.stats.missed++;
    if (s.stats.missed % 3 === 0) rep(s, -1);
    const wanted = getProduct(favorites[0]);
    event(s, `${regular?.name || audience.name}没买到${wanted.name}，有些遗憾地离开了。`, 'miss');
    return;
  }
  const quantity = Math.min(s.stock[chosen.id], random(s) < 0.35 ? 2 : 1);
  const price = Math.round(chosen.price * (s.discount ? 0.8 : 1)) * quantity;
  s.stock[chosen.id] -= quantity; income(s, price);
  s.stats.sold += quantity; s.stats.served++; s.totalServed++;
  if (s.stats.served % 3 === 0) rep(s, 1);
  if (regular && chosen.id === regular.favorite) {
    s.affection[regular.id]++;
    const level = Math.min(2, Math.floor((s.affection[regular.id] - 1) / 4));
    event(s, `${regular.name}买了${chosen.name}。${regular.stories[level]}`, 'regular');
  } else event(s, `${regular?.name || audience.name}带走了 ${quantity} 份${chosen.name}，收入 ¥${price}。`, 'sale');
}

function advance(s, seconds = 1) {
  if (s.paused || s.phase === 'closed') return;
  for (let i = 0; i < seconds; i++) {
    for (const j of s.jobs) j.remaining--;
    const finished = s.jobs.filter(j => j.remaining <= 0);
    for (const j of finished) {
      s.stock[j.product] += j.quantity;
      event(s, `${getProduct(j.product).name}出炉！${j.quantity} 份新鲜上架。`, 'ready');
    }
    s.jobs = s.jobs.filter(j => j.remaining > 0);
    if (s.phase === 'open') {
      s.minute += 5; s.elapsed++;
      const interval = Math.max(2, weatherFor(s).interval - s.upgrades.sign - (s.day % 7 === 0 ? 1 : 0));
      if (s.elapsed % interval === 0) customer(s);
      if (s.minute >= 1080) { closeShop(s); break; }
    }
  }
}

function orderFor(s) {
  const items = ['roll', 'toast', 'croissant'];
  const product = items[(s.day - 1) % items.length];
  const p = getProduct(product);
  return { product, quantity: 6, reward: p.price * 6 + 28, name: ['小雨的课间分享', '林奶奶的早餐篮', '街坊办公室茶歇'][(s.day - 1) % 3] };
}

function fulfillOrder(s) {
  if (s.phase === 'closed') return { error: '今天打烊了，明天再来接单吧。' };
  if (s.orderDone) return { error: '今天的预订已经完成啦。' };
  const o = orderFor(s);
  if (s.stock[o.product] < o.quantity) return { error: `还需要 ${o.quantity - s.stock[o.product]} 份${getProduct(o.product).name}，出炉后再交付吧。` };
  s.stock[o.product] -= o.quantity; s.orderDone = true;
  income(s, o.reward); s.stats.sold += o.quantity; rep(s, 3);
  const id = s.day % 3 === 1 ? 'yu' : 'lin'; s.affection[id]++;
  event(s, `完成「${o.name}」，收到 ¥${o.reward} 和一份暖心的感谢。`, 'regular');
  return { ok: true };
}

function buyUpgrade(s, id) {
  const u = UPGRADES.find(u => u.id === id);
  if (!u || s.upgrades[id] >= u.max) return { error: '这项升级已经完成了。' };
  const cost = upgradeCost(s, u);
  if (s.cash < cost) return { error: `还差 ¥${cost - s.cash}，再经营一会儿吧。` };
  s.cash -= cost; s.upgrades[id]++;
  event(s, `${u.name}升级完成，小店又向前了一步。`, 'upgrade');
  return { ok: true };
}

function research(s, id) {
  const p = getProduct(id);
  if (!p || s.unlocked.includes(id)) return { error: '已经掌握这份配方啦。' };
  if (s.reputation < p.unlock) return { error: `口碑达到 ${p.unlock} 后，可以研发这款新品。` };
  if (s.cash < p.research) return { error: `研发还需要 ¥${p.research - s.cash}。` };
  s.cash -= p.research; s.unlocked.push(id);
  event(s, `${p.name}研发成功！现在可以加入今日菜单了。`, 'upgrade');
  return { ok: true };
}

function closeShop(s) {
  if (s.phase !== 'open') return { error: '还没有开始营业。' };
  // Finish paid batches before clearance, so no ingredients or cash vanish silently.
  for (const j of s.jobs) s.stock[j.product] += j.quantity;
  s.jobs = [];
  const remaining = Object.values(s.stock).reduce((a, b) => a + b, 0);
  const clearance = PRODUCTS.reduce((total, p) => total + s.stock[p.id] * Math.floor(p.price * 0.25), 0);
  const expenses = 8 + (s.upgrades.helper ? 25 : 0);
  const goalMet = s.stats.revenue >= dailyTarget(s);
  s.stats.bonus = goalMet ? 40 : 0;
  s.cash += clearance + s.stats.bonus - expenses;
  s.stats.expense += expenses;
  s.stats.waste = remaining;
  s.stock = Object.fromEntries(PRODUCTS.map(p => [p.id, 0]));
  s.phase = 'closed'; s.minute = Math.min(s.minute, 1080); s.paused = false;
  if (goalMet) rep(s, 2);
  s.lastSummary = { ...s.stats, day: s.day, clearance, profit: s.stats.revenue + clearance + s.stats.bonus - s.stats.expense, goalMet, early: s.minute < 1080 };
  s.history.unshift(s.lastSummary); s.history = s.history.slice(0, 30);
  event(s, `今天打烊啦。服务 ${s.stats.served} 位客人，明天也要热气腾腾。`, 'close');
  return { ok: true };
}

function nextDay(s) {
  if (s.phase !== 'closed') return { error: '先完成今天的营业吧。' };
  s.day++; s.phase = 'prep'; s.minute = 540; s.elapsed = 0;
  s.stats = dailyStats(); s.orderDone = false; s.discount = false; s.lastSummary = null;
  // A small, visible community advance prevents a save from becoming unplayable.
  if (s.cash < 18) {
    const aid = 60 - s.cash; s.cash = 60;
    event(s, `街坊互助金送来 ¥${aid}，先烤一炉面包重新出发吧。`, 'regular');
  }
  event(s, `第 ${s.day} 天，${weatherFor(s).name}。${weatherFor(s).label}。`, 'note');
  return { ok: true };
}

function validateSave(raw) {
  if (!raw || raw.version !== 1) return false;
  const numeric = ['day', 'cash', 'reputation', 'minute', 'rng', 'elapsed', 'nextId', 'totalRevenue', 'totalServed'];
  if (!numeric.every(k => Number.isFinite(raw[k]))) return false;
  if (!Number.isInteger(raw.day) || raw.day < 1 || raw.reputation < 0 || raw.reputation > 100 || !Number.isInteger(raw.rng) || raw.rng <= 0 || raw.rng >= 2147483647 || raw.minute < 540 || raw.minute > 1080) return false;
  if (!['prep', 'open', 'closed'].includes(raw.phase) || !['sage', 'rose', 'sand'].includes(raw.theme)) return false;
  if (!Array.isArray(raw.unlocked) || !['roll', 'toast', 'croissant'].every(id => raw.unlocked.includes(id)) || raw.unlocked.some(id => !getProduct(id))) return false;
  if (!raw.stock || !PRODUCTS.every(p => Number.isInteger(raw.stock[p.id]) && raw.stock[p.id] >= 0)) return false;
  if (!raw.upgrades || !UPGRADES.every(u => Number.isInteger(raw.upgrades[u.id]) && raw.upgrades[u.id] >= 0 && raw.upgrades[u.id] <= u.max)) return false;
  if (!raw.affection || !REGULARS.every(r => Number.isInteger(raw.affection[r.id]) && raw.affection[r.id] >= 0)) return false;
  if (!raw.stats || !Object.keys(dailyStats()).every(k => Number.isFinite(raw.stats[k]) && raw.stats[k] >= 0)) return false;
  if (!Array.isArray(raw.jobs) || raw.jobs.length > 3 || raw.jobs.some(j => !getProduct(j.product) || !raw.unlocked.includes(j.product) || j.quantity !== 6 || !Number.isFinite(j.duration) || j.duration <= 0 || !Number.isFinite(j.remaining) || j.remaining <= 0 || j.remaining > j.duration)) return false;
  if (!Array.isArray(raw.events) || raw.events.length > 30 || raw.events.some(e => typeof e.text !== 'string' || typeof e.type !== 'string' || !Number.isFinite(e.minute) || !Number.isFinite(e.day))) return false;
  if (!Array.isArray(raw.history) || raw.history.length > 30 || raw.history.some(h => !['day', 'revenue', 'expense', 'clearance', 'bonus', 'profit', 'served', 'missed', 'sold', 'waste'].every(k => Number.isFinite(h[k])))) return false;
  if (raw.phase === 'closed' && (!raw.lastSummary || !['day', 'revenue', 'expense', 'clearance', 'bonus', 'profit', 'served', 'missed', 'sold', 'waste'].every(k => Number.isFinite(raw.lastSummary[k])))) return false;
  return typeof raw.paused === 'boolean' && typeof raw.discount === 'boolean' && typeof raw.orderDone === 'boolean';
}


function pastry(id, className = '') {
  const drawings = {
    roll: `<ellipse cx="100" cy="126" rx="60" ry="10" fill="#b18a52" opacity=".13"/><path d="M37 103c-3-30 16-57 45-57 10-12 42-7 47 5 28 1 44 35 34 59-9 22-115 25-126-7Z" fill="url(#dough)"/><path d="M83 48c-9 17-15 38-12 61M126 51c-6 16-9 37-6 54" stroke="#f9daa0" stroke-width="6" stroke-linecap="round"/><path d="M45 107c36 12 79 12 113-2" stroke="#b57536" stroke-width="2" opacity=".5"/>`,
    toast: `<ellipse cx="100" cy="134" rx="59" ry="8" fill="#b18a52" opacity=".13"/><path d="M49 67c-7-33 13-47 34-38 11-10 32-10 42 1 26-7 41 14 30 37v62H49Z" fill="#ad6e37"/><path d="M55 67c-7-27 12-39 29-30 13-10 28-9 40 1 20-8 33 11 23 30v55H55Z" fill="url(#dough)"/><path d="M66 69c-8-17 5-27 20-20 12-8 23-8 35 1 15-6 25 6 17 20v42H66Z" fill="#f4ddb0"/><path d="M85 58v48M104 57v48M123 62v43" stroke="#e9cb95" stroke-width="2" stroke-dasharray="2 6"/>`,
    croissant: `<ellipse cx="100" cy="128" rx="66" ry="8" fill="#b18a52" opacity=".13"/><path d="M37 117c-19-25 3-63 27-65 11-26 60-28 74 1 30 7 43 41 26 62l-18-16c-5-11-12-10-18-5-15 15-40 14-55-1-8-6-15 3-17 10Z" fill="url(#dough)"/><path d="m65 54 9 39m17-52 2 59m22-59-8 60m29-47-15 39M45 75l18 17m92-18-16 17" stroke="#aa632f" stroke-width="4" stroke-linecap="round"/><path d="m68 61 7 22m17-34 1 42m21-42-5 41m24-28-9 21" stroke="#f7d28b" stroke-width="4" stroke-linecap="round"/>`,
    cinnamon: `<ellipse cx="101" cy="130" rx="61" ry="8" fill="#b18a52" opacity=".13"/><path d="M43 75h114v42c-13 29-101 26-114-1Z" fill="#ba7843"/><ellipse cx="100" cy="76" rx="57" ry="39" fill="url(#dough)"/><path d="M147 80c-2-47-95-39-95-6s75 37 82 5-55-26-61-10 31 25 40 10-17-14-18-5" stroke="#92532e" stroke-width="6" fill="none" stroke-linecap="round"/><path d="m60 56 3 40 16-42 5 42 17-47 5 46 17-41 3 33 15-23" stroke="#f8e8cb" stroke-width="4" stroke-linecap="round" opacity=".8"/>`,
    cake: `<ellipse cx="101" cy="133" rx="64" ry="8" fill="#b18a52" opacity=".13"/><path d="m52 72 58-30 49 31v55H52Z" fill="#f0d4b3"/><path d="M52 88h107v14H52Z" fill="#c8776d"/><path d="M52 102h107v9H52Z" fill="#fff0dc"/><path d="m52 70 57-31 50 32v12c-9 13-17-6-27 2s-15-6-25 0-18-5-27 1-20 4-28-2Z" fill="#fff7e8"/><path d="M97 58c-18-17-1-37 10-25 12-14 29 4 10 25-7 5-14 5-20 0Z" fill="#c66f5a"/><path d="m107 34-2-12m2 12-9-7m9 7 10-9" stroke="#718758" stroke-width="3" stroke-linecap="round"/><path d="m100 44 2 2m12-6 2 2m-7 10 1 2" stroke="#f5d298" stroke-width="2"/>`,

const SAVE_KEY = 'maijian-bakery-v1';

const modalRoot = document.querySelector('#modal-root');

const esc = text => String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const action = (name, label, cls = 'button', extra = '') => `<button class="${cls}" data-action="${name}" ${extra}>${label}</button>`;

function load() {
  try {
    const text = localStorage.getItem(SAVE_KEY);
    if (text) {
      const raw = JSON.parse(text);
      if (validateSave(raw)) return raw;
      localStorage.setItem(`${SAVE_KEY}-backup`, text);
      loadMessage = '旧存档格式异常，已保留备份，并为你开启新小店。';
    }
  } catch { loadMessage = '无法读取存档，已开启新小店。请在设置中导出备份。'; }
  return createGame();
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); storageOK = true; }
  catch { if (storageOK) toast('浏览器存储不可用，请通过设置导出存档。'); storageOK = false; }
}
function toast(message) {
  const el = document.querySelector('#toast');
  el.textContent = message; el.classList.add('visible');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('visible'), 3800);
}
function run(fn, success) {
  const result = fn();
  if (result?.error) toast(result.error);
  else if (success) toast(success);
  save(); render();
}

  </section>`;
}

function orderPanel() {
  const o = orderFor(state), p = getProduct(o.product), count = Math.min(o.quantity, state.stock[o.product]);
  const latest = state.events.find(e => ['regular', 'sale', 'miss', 'ready'].includes(e.type));
  return `<aside class="today-column"><section class="order-card panel"><div class="panel-heading"><h2>街坊的预订</h2>${icon('gift')}</div><div class="order-paper"><span class="paper-pin"></span><div class="order-top"><span class="order-number">ORDER #${String(state.day).padStart(3, '0')}</span><span class="handwritten">给今天一点期待</span></div><h3>${o.name}</h3><p>“想把这份香甜，也分享给身边的人。”</p><div class="order-product">${pastry(o.product)}<div><strong>${p.name} × ${o.quantity}</strong><span>今日交付 · 口碑 +3</span></div></div><div class="order-reward"><span>一份暖心回报</span><b>${money(o.reward)}</b></div><div class="order-progress"><span>${state.orderDone ? '谢谢你，已经收到啦' : `已备好 ${count} / ${o.quantity} 份`}</span><span>${state.orderDone ? '100' : Math.round(count / o.quantity * 100)}%</span></div><div class="progress"><i style="width:${state.orderDone ? 100 : count / o.quantity * 100}%"></i></div></div>${action('fulfill', state.orderDone ? `${icon('check')} 预订已完成` : `交付预订 ${icon('arrow')}`, `button ${state.orderDone ? 'completed' : 'primary'} full`, `${state.orderDone || state.phase === 'closed' ? 'disabled' : ''}`)}</section>
    <section class="daily-note"><span>${icon('heart')} 小店里的声音</span><p>${latest ? esc(latest.text) : '“路过闻到面包香，忍不住想进来看看。”'} </p><small>${latest ? `第 ${latest.day} 天 · ${time(latest.minute)}` : '来自未来的第一位客人'}</small></section></aside>`;
}

function productCard(p, recipeView = false) {
  const unlocked = state.unlocked.includes(p.id), job = state.jobs.find(j => j.product === p.id);
  return `<article class="product-card ${!unlocked ? 'is-locked' : ''}"><div class="product-art art-${p.id}">${pastry(p.id)}<span class="product-tag">${!unlocked ? `${icon('lock')} 新风味` : p.id === 'roll' ? '店长推荐' : p.id === 'croissant' ? '酥香人气' : p.audience}</span>${unlocked ? `<span class="stock-count">在售 <b>${state.stock[p.id]}</b></span>` : ''}</div><div class="product-body"><div class="product-title"><div><h3>${p.name}</h3><span>${p.en}</span></div><strong>${money(Math.round(p.price * (state.discount ? 0.8 : 1)))}<small>/ 份</small></strong></div><p>${p.description}</p><div class="product-meta"><span>${icon('clock')} ${Math.ceil(p.time * (state.upgrades.helper ? 0.65 : 1))} 秒 / 炉</span><span>6 份 · 食材 ${money(p.cost)}</span></div>${unlocked ? action(`bake:${p.id}`, `${icon(job ? 'oven' : 'plus')} ${job ? '再烤一炉' : '烤一炉'}<span>−${money(p.cost)}</span>`, 'button bake-button full', `data-key="bake-${p.id}" ${state.phase === 'closed' ? 'disabled' : ''}`) : action(`research:${p.id}`, `${icon('lock')} ${state.reputation < p.unlock ? `口碑 ${p.unlock} 解锁研发` : `研发配方 · ${money(p.research)}`}`, 'button research-button full', `${state.reputation < p.unlock ? 'disabled' : ''}`)}${recipeView ? `<div class="recipe-profit">每炉满售收益 <b>+${money(p.price * 6 - p.cost)}</b><span>未扣水电与工资</span></div>` : ''}</div></article>`;
}

function menu() {
  return `<section class="menu-section"><div class="section-heading"><div><h2>今日的面包架 <span>TODAY'S FRESH BAKES</span></h2><p>一炉六份，刚刚好的香气。</p></div><div class="menu-tools"><span class="capacity">${occupied(state)} / ${capacity(state)} 陈列位</span>${action('discount', `<span class="switch ${state.discount ? 'on' : ''}"><i></i></span> 八折促销`, 'discount-button', `role="switch" aria-checked="${state.discount}"`)}${action('recipes', `全部食谱 ${icon('arrow')}`, 'text-button')}</div></div><div class="product-grid">${PRODUCTS.filter(p => state.unlocked.includes(p.id)).map(p => productCard(p)).join('')}</div></section>`;
}

function recipes() {
  return `<div class="section-intro"><span class="tag">${icon('book')} 已掌握 ${state.unlocked.length} / ${PRODUCTS.length} 份配方</span><p>每一款新品，都是小店新的可能。研发会消耗零钱，解锁后即可烘焙。</p></div><div class="product-grid recipe-grid">${PRODUCTS.map(p => productCard(p, true)).join('')}</div>`;
}

function upgrades() {
  return `<div class="growth-banner"><div><span class="eyebrow">LITTLE BY LITTLE</span><h2>不必很快，慢慢变好。</h2><p>更大的烤箱、更亮的招牌。把赚来的零钱，花在你期待的未来。</p></div>${icon('wheat')}</div><div class="upgrade-grid">${UPGRADES.map(u => `<article class="upgrade-card panel"><div class="upgrade-icon">${icon(u.icon)}</div><div class="upgrade-heading"><h3>${u.name}</h3><span>Lv. ${state.upgrades[u.id]} / ${u.max}</span></div><p>${u.description}</p><div class="upgrade-dots">${Array.from({ length: u.max }, (_, i) => `<i class="${i < state.upgrades[u.id] ? 'filled' : ''}"></i>`).join('')}</div>${action(`upgrade:${u.id}`, state.upgrades[u.id] >= u.max ? `${icon('check')} 已升至满级` : `升级设备 <span>${money(upgradeCost(state, u))} ${icon('arrow')}</span>`, 'button outline full', state.upgrades[u.id] >= u.max ? 'disabled' : '')}</article>`).join('')}</div><section class="decoration panel"><div><span class="eyebrow">A TOUCH OF YOU</span><h2>给小店，换一种心情。</h2><p>喜欢的颜色，本身就是一种奖励。门面配色免费更换。</p></div><div class="theme-options">${[['sage', '鼠尾草绿'], ['rose', '落日玫瑰'], ['sand', '蜂蜜暖棕']].map(([id, label]) => action(`theme:${id}`, `<i class="theme-swatch ${id}">${state.theme === id ? icon('check') : ''}</i><span>${label}</span>`, `theme-button ${state.theme === id ? 'active' : ''}`, `aria-pressed="${state.theme === id}"`)).join('')}</div></section>`;
}

function journal() {
  return `<section class="regulars"><div class="section-heading"><div><h2>那些熟悉的身影 <span>OUR NEIGHBOURS</span></h2><p>一份面包，慢慢变成一份惦记。</p></div><span class="tag">${icon('heart')} ${state.totalServed} 次温暖相遇</span></div><div class="regular-grid">${REGULARS.map(r => { const count = state.affection[r.id], level = Math.min(2, Math.floor(Math.max(0, count - 1) / 4)); return `<article class="regular-card panel"><div class="avatar" style="--avatar-color:${r.color}">${r.initial}<span>${icon('heart')}</span></div><div><h3>${r.name}<small>${count >= 9 ? '老朋友' : count >= 4 ? '渐渐熟悉' : '初次相识'}</small></h3><span class="muted">${r.tag}</span><p>${count ? r.stories[level] : '还没正式认识，备好喜欢的面包，等一次温暖相遇。'}</p><div class="friendship">${Array.from({ length: 5 }, (_, i) => icon('heart', i < Math.ceil(count / 2) ? 'filled-heart' : '')).join('')}<span>暖心互动 ${count} 次</span></div></div></article>`; }).join('')}</div></section>
    <div class="journal-columns"><section class="panel journal-feed"><div class="panel-heading"><h2>小店流水笺</h2><span class="muted">最近 30 条</span></div>${state.events.length ? state.events.map(e => `<div class="feed-item"><span class="feed-icon ${esc(e.type)}">${icon(e.type === 'sale' ? 'coin' : e.type === 'regular' ? 'heart' : e.type === 'miss' ? 'people' : 'wheat')}</span><div><p>${esc(e.text)}</p><small>第 ${e.day} 天 · ${time(e.minute)}</small></div></div>`).join('') : '<div class="empty-state">还没有故事。烤一炉面包，故事就开始了。</div>'}</section><section class="panel history-panel"><div class="panel-heading"><h2>营业小结</h2>${icon('chart')}</div>${state.history.length ? state.history.map(h => `<article class="history-row"><div><b>第 ${h.day} 天</b><small>售出 ${h.sold} 份 · 招待 ${h.served} 人</small></div><strong class="${h.profit >= 0 ? 'positive' : 'negative'}">${h.profit >= 0 ? '+' : '−'}${money(Math.abs(h.profit))}<small>营业结余</small></strong></article>`).join('') : '<div class="empty-state">结束第一天营业后，<br>这里会记住你的努力。</div>'}</section></div>`;
}

function render() {
  const focused = document.activeElement?.dataset.action;
  app.innerHTML = `${sidebar()}<main>${header()}${metrics()}<div class="page-content">${view === 'shop' ? `<div class="shop-layout">${shopScene()}${orderPanel()}</div>${menu()}` : view === 'recipes' ? recipes() : view === 'upgrades' ? upgrades() : journal()}</div><footer>麦间 · 街角烘焙日记 <span>把平凡的日子，烤得香一点。</span><span>慢慢来，好味道值得等待 ${icon('wheat')}</span></footer></main>`;
  if (focused) app.querySelector(`[data-action="${focused}"]`)?.focus({ preventScroll: true });
}

function openModal(kind) {
  modal = kind;
  let content;
  if (kind === 'summary') {
    const h = state.lastSummary;
    if (!h) return;
    content = `<div class="summary-art">${icon('wheat')}</div><p class="eyebrow">DAY ${String(h.day).padStart(2, '0')} · A DAY WELL SPENT</p><h2>今天的努力，香气满满。</h2><p class="modal-subtitle">${h.early ? '提前收好小店，也给自己留一点时间。' : '灯光暗下来，今天的故事先写到这里。'}</p><div class="summary-main"><span>今日营业结余</span><strong class="${h.profit >= 0 ? '' : 'negative'}">${h.profit >= 0 ? '+' : '−'}${money(Math.abs(h.profit))}</strong></div><dl class="summary-ledger"><div><dt>面包与预订收入</dt><dd>${money(h.revenue)}</dd></div><div><dt>食材、水电${state.upgrades.helper ? '与工资' : ''}</dt><dd>−${money(h.expense)}</dd></div><div><dt>余量 ${h.waste} 份 · 闭店折价回收</dt><dd>+${money(h.clearance)}</dd></div><div><dt>今日心愿 ${h.goalMet ? '达成' : '未达成'}</dt><dd>+${money(h.bonus)}</dd></div></dl><div class="summary-people"><span>${icon('people')} 招待 ${h.served} 位客人</span><span>${icon('shop')} 售出 ${h.sold} 份美味</span></div><p class="fine-print">闭店时，未出炉的批次一并完成。剩余面包按售价的约 25% 回收，不隔夜销售。设备与配方投资不计入营业结余。</p>${action('next', `收好今天，迎接明天 ${icon('arrow')}`, 'button primary full')}${action('dismiss', '先看看今天的小店', 'text-button full')}`;
  } else if (kind === 'close-confirm') {
    content = `${icon('shop', 'modal-symbol')}<p class="eyebrow">CLOSE FOR TODAY</p><h2>今天就营业到这里？</h2><p class="modal-subtitle">当前时间 ${time(state.minute)}。剩余面包会折价回收，正在烤的批次会一并结算，今天未交付的预订将结束。</p>${action('close', '确认打烊', 'button primary full')}${action('dismiss', '再经营一会儿', 'button outline full')}`;
  } else if (kind === 'reset-confirm') {
    content = `${icon('leaf', 'modal-symbol')}<h2>重新开一家小店？</h2><p class="modal-subtitle">这会清除当前进度。建议先回到设置导出存档，留住这段日子。</p>${action('reset', '确认重新开始', 'button danger full')}${action('settings', '返回，先保留进度', 'button outline full')}`;
  } else {
    content = `<p class="eyebrow">MAKE YOURSELF AT HOME</p><h2>留住小店的每一天。</h2><p class="modal-subtitle">游戏会自动保存在当前浏览器中。清理浏览器数据或更换设备前，记得导出一份存档。</p><div class="settings-group"><h3>存档与备份</h3>${action('export', `${icon('journal')} 导出存档 ${icon('arrow')}`, 'button outline full')}<label class="button outline full import-button">${icon('book')} 导入存档<input type="file" id="import-save" accept=".json,application/json" /></label></div><div class="settings-group"><h3>经营小贴士</h3><p>选一款面包，每炉烤 6 份。开门后顾客自动选购，可以随时补烤。每天 09:00–18:00 约 108 秒；备货阶段只运行烤箱。暂停或打开弹窗时，时间停止。</p><p>八折促销会降低售价，并让顾客更愿意尝试其他口味。预订每天一份，营业前后都能交付。</p><p>天气与周末会影响客流。错过心愿也没关系，明天还有新机会。</p></div>${action('reset-confirm', '重新开始游戏', 'text-button danger-text full')}`;
  }
  modalRoot.innerHTML = `<div class="modal-overlay"><section class="modal ${kind === 'summary' ? 'summary-modal' : ''}" role="dialog" aria-modal="true" aria-label="${kind === 'summary' ? '今日营业结算' : '小店设置'}" tabindex="-1">${action('dismiss', icon('close'), 'icon-button modal-close', 'aria-label="关闭弹窗"')}${content}</section></div>`;
  document.body.classList.add('modal-open');
  requestAnimationFrame(() => modalRoot.querySelector('.modal')?.focus());
}

function dismiss() { modal = null; modalRoot.innerHTML = ''; document.body.classList.remove('modal-open'); }

document.addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target || target.disabled) return;
  e.preventDefault();
  const [name, id] = target.dataset.action.split(':');
  if (['shop', 'recipes', 'upgrades', 'journal'].includes(name)) { view = name; dismiss(); render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
  else if (name === 'bake') run(() => bake(state, id), '面团送进烤箱啦，稍等片刻。');
  else if (name === 'open') run(() => openShop(state), '营业牌已翻开，欢迎第一位客人！');
  else if (name === 'fulfill') run(() => fulfillOrder(state), '预订已送出，感谢你的用心！');
  else if (name === 'upgrade') run(() => buyUpgrade(state, id), '升级完成，小店又变好了！');
  else if (name === 'research') run(() => research(state, id), '新配方已收好，可以烤一炉试试啦！');
  else if (name === 'theme') { state.theme = id; save(); render(); toast('门面配色已更换，在我的小店看看吧。'); }
  else if (name === 'discount') { state.discount = !state.discount; save(); render(); toast(state.discount ? '八折促销已开启，顾客更愿意尝试不同口味。' : '恢复原价，用好味道留住客人。'); }
  else if (name === 'pause') { state.paused = !state.paused; save(); render(); }
  else if (['settings', 'close-confirm', 'reset-confirm', 'summary'].includes(name)) openModal(name);
  else if (name === 'dismiss') dismiss();
  else if (name === 'close') { dismiss(); run(() => closeShop(state)); openModal('summary'); }
  else if (name === 'next') { dismiss(); run(() => nextDay(state)); }
  else if (name === 'reset') { state = createGame(); view = 'shop'; dismiss(); save(); render(); toast('新的小店，新的一天。欢迎回来。'); }
  else if (name === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `麦间-第${state.day}天.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('存档已导出，替你留住这段日子。');
  }
});

document.addEventListener('change', async e => {
  if (e.target.id !== 'import-save') return;
  const file = e.target.files[0];
  if (!file) return;
  try {
    if (file.size > 1000000) throw Error('存档文件过大。');
    const raw = JSON.parse(await file.text());
    if (!validateSave(raw)) throw Error('存档格式不正确，原来的进度已保留。');
    if (!window.confirm(`载入第 ${raw.day} 天的存档？这将替换当前进度。`)) return;
    state = raw; view = 'shop'; dismiss(); save(); render(); toast('存档载入成功，小店等你很久啦。');
    if (state.phase === 'closed') openModal('summary');
  } catch (error) { toast(error instanceof SyntaxError ? '无法解析存档，请选择导出的 JSON 文件。' : error.message); }
  finally { e.target.value = ''; }
});

document.addEventListener('keydown', e => {
  if (!modal) return;
  if (e.key === 'Escape') dismiss();
  if (e.key === 'Tab') {
    const items = [...modalRoot.querySelectorAll('button:not(:disabled), input, [tabindex="0"]')];
    const first = items[0], last = items.at(-1);
    if (e.shiftKey && (document.activeElement === first || document.activeElement.classList.contains('modal'))) { e.preventDefault(); last?.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
  }
});
modalRoot.addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) dismiss(); });
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', save);
setInterval(() => {
  if (modal || document.hidden || state.paused || state.phase === 'closed') return;
  const previous = state.phase;
  advance(state); save(); render();
  if (previous === 'open' && state.phase === 'closed') openModal('summary');
}, 1000);
render(); save();
if (loadMessage) toast(loadMessage);
if (state.phase === 'closed') openModal('summary');

})();
</script>
</body>
</html>
